<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reclamar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    width: 100%;
    font-family: 'Georgia', serif;
    overflow: hidden;
  }

  /* ===== FONDO CON IMAGEN DE PARÍS ===== */
  body {
    background-color: #1a0d05;
    background-image: url('paris.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0.15) 0%,
      rgba(0,0,0,0.55) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* ===== TARJETA ===== */
  .tarjeta {
    position: relative;
    z-index: 10;
    background: #f5ecd7;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(180,140,90,0.10) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(180,140,90,0.10) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,250,235,0.5) 0%, transparent 70%);
    border-radius: 12px;
    padding: 45px 40px 60px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow:
      0 0 0 8px #f5ecd7,
      0 0 0 10px #d4c4a0,
      0 25px 70px rgba(0,0,0,0.85),
      0 0 100px rgba(255,160,60,0.3);
    border: 2px solid #d4c4a0;
    animation: aparecer 0.8s ease-out;
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tarjeta::before, .tarjeta::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border: 2px solid #b8a67d;
  }
  .tarjeta::before {
    top: 12px; left: 12px;
    border-right: none; border-bottom: none;
    border-radius: 8px 0 0 0;
  }
  .tarjeta::after {
    bottom: 12px; right: 12px;
    border-left: none; border-top: none;
    border-radius: 0 0 8px 0;
  }

  /* ===== TEXTO EDITABLE ===== */
  .texto-principal {
    color: #3a2418;
    font-size: 1.15em;
    line-height: 1.7;
    font-style: italic;
    margin-bottom: 35px;
  }

  /* ===== BOTÓN RECLAMAR ===== */
  .btn-reclamar {
    background: #3a2418;
    color: #f5ecd7;
    border: none;
    padding: 16px 55px;
    border-radius: 30px;
    font-size: 1.25em;
    font-family: 'Georgia', serif;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.35);
    letter-spacing: 1px;
    position: relative;
    z-index: 20;
  }
  .btn-reclamar:hover {
    background: #5a3a28;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 8px 22px rgba(0,0,0,0.45);
  }
  .btn-reclamar:active {
    transform: scale(0.97);
  }

  /* ===== CONTADOR CON RELIEVE (abajo izquierda) ===== */
  .contador {
    position: absolute;
    bottom: 18px;
    left: 20px;
    font-family: 'Georgia', serif;
    font-size: 1.1em;
    font-weight: bold;
    color: #b8a67d;
    z-index: 15;
    padding: 4px 12px;
    border-radius: 6px;
    /* Efecto relieve: sombra clara abajo, oscura arriba */
    text-shadow:
      0 -1px 0 #8a7060,
      0 1px 0 #ffffff,
      0 2px 3px rgba(0,0,0,0.15);
    background: transparent;
    letter-spacing: 1px;
    user-select: none;
  }

  /* ===== EMOJIS DE BESO EXPLOTANDO ===== */
  .beso {
    position: fixed;
    font-size: 1.8em;
    pointer-events: none;
    z-index: 100;
    will-change: transform, opacity;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .tarjeta { padding: 35px 25px 55px; }
    .texto-principal { font-size: 1em; }
    .btn-reclamar { padding: 14px 40px; font-size: 1.1em; }
    .contador { font-size: 0.95em; bottom: 14px; left: 15px; }
  }
  
  /* ===== BOTONES MULTIPLICADORES ===== */
.multiplicadores {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 35px;
  flex-wrap: wrap;
}

.btn-multiplicador {
  background: #f5ecd7;
  color: #3a2418;
  border: 2px solid #b8a67d;
  padding: 8px 18px;
  border-radius: 20px;
  font-family: 'Georgia', serif;
  font-size: 0.95em;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.15),
    inset 0 1px 0 rgba(255,255,255,0.4);
  letter-spacing: 0.5px;
  opacity: 0.5;
  position: relative;
}

/* Estado bloqueado */
.btn-multiplicador:disabled {
  cursor: not-allowed;
  opacity: 0.4;
  filter: grayscale(0.6);
}

/* Estado activo (habilitado desde Firebase) */
.btn-multiplicador.activo {
  opacity: 1;
  filter: none;
  border-color: #3a2418;
  background: #f5ecd7;
  box-shadow:
    0 3px 10px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.5);
}

.btn-multiplicador.activo:hover {
  background: #efe0c5;
  transform: translateY(-2px);
  box-shadow:
    0 5px 14px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.5);
}

/* Estado seleccionado (activo y elegido) */
.btn-multiplicador.seleccionado {
  background: #3a2418;
  color: #f5ecd7;
  border-color: #3a2418;
  box-shadow:
    0 4px 14px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.1);
  transform: translateY(-2px);
}

.btn-multiplicador.seleccionado:hover {
  background: #4a3020;
  color: #f5ecd7;
}
</style>
</head>
<body>

  <div class="tarjeta">
    <!-- ✏️ EDITA AQUÍ EL TEXTO -->
    <p class="texto-principal">
      Escribe aquí el texto que quieras mostrar.<br>
      Puedes cambiarlo cuando quieras.
    </p>

    <!-- BOTÓN RECLAMAR -->
    <button class="btn-reclamar" id="btnReclamar">Reclamar</button>
    
    <!-- BOTONES MULTIPLICADORES -->
<div class="multiplicadores">
  <button class="btn-multiplicador" id="mult-x2" data-valor="2" disabled>x2</button>
  <button class="btn-multiplicador" id="mult-x3" data-valor="3" disabled>x3</button>
  <button class="btn-multiplicador" id="mult-x4" data-valor="4" disabled>x4</button>
  <button class="btn-multiplicador" id="mult-x10" data-valor="10" disabled>x10</button>
</div>

    <!-- CONTADOR CON RELIEVE -->
    <div class="contador" id="contadorNumero">0</div>
  </div>

<!-- SDK de Firebase (versión compat) -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
  /* ===== CONFIGURACIÓN DE FIREBASE ===== */
  const firebaseConfig = {
    apiKey: "AIzaSyDFnxii6rqaS7zYJIgAB5g3OITL5Jvo8mM",
    authDomain: "contador-ea118.firebaseapp.com",
    databaseURL: "https://contador-ea118-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "contador-ea118",
    storageBucket: "contador-ea118.firebasestorage.app",
    messagingSenderId: "1029695503526",
    appId: "1:1029695503526:web:d81dbaab9fd075a93ec867"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const contadorRef = db.ref('reclamos');
  const multiplicadoresRef = db.ref('multiplicadores');
  const contadorNumero = document.getElementById('contadorNumero');

  /* ===== ESTADO LOCAL ===== */
  let multiplicadorActivo = 1;

  /* ===== ESCUCHAR CONTADOR EN TIEMPO REAL ===== */
  contadorRef.on('value', (snapshot) => {
    const valor = snapshot.val() || 0;
    contadorNumero.textContent = valor;
  });

  /* ===== ESCUCHAR MULTIPLICADORES EN TIEMPO REAL ===== */
  multiplicadoresRef.on('value', (snapshot) => {
    const datos = snapshot.val() || { x2: false, x3: false, x4: false, x10: false };

    // Actualizar cada botón según su estado
    ['x2', 'x3', 'x4', 'x10'].forEach(id => {
      const btn = document.getElementById('mult-' + id);
      if (!btn) return;

      if (datos[id] === true) {
        btn.classList.add('activo');
        btn.disabled = false;
      } else {
        btn.classList.remove('activo');
        btn.disabled = true;
        // Si estaba seleccionado y se desactiva, quitar selección
        if (multiplicadorActivo === parseInt(id.replace('x', ''))) {
          multiplicadorActivo = 1;
          document.querySelectorAll('.btn-multiplicador').forEach(b => b.classList.remove('seleccionado'));
        }
      }
    });
  });

  /* ===== SELECCIONAR MULTIPLICADOR ===== */
  document.querySelectorAll('.btn-multiplicador').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.disabled) return;

      const valor = parseInt(this.dataset.valor);

      // Si ya está seleccionado, deseleccionar
      if (multiplicadorActivo === valor) {
        multiplicadorActivo = 1;
        this.classList.remove('seleccionado');
        return;
      }

      // Deseleccionar los demás
      document.querySelectorAll('.btn-multiplicador').forEach(b => b.classList.remove('seleccionado'));

      // Activar el nuevo
      multiplicadorActivo = valor;
      this.classList.add('seleccionado');
    });
  });

  /* ===== EXPLOSIÓN DE BESOS ===== */
  function lanzarBesos(btn) {
    const rect = btn.getBoundingClientRect();
    const origenX = rect.left + rect.width / 2;
    const origenY = rect.top + rect.height / 2;

    const total = 25;

    for (let i = 0; i < total; i++) {
      const beso = document.createElement('div');
      beso.className = 'beso';
      beso.textContent = '😘';
      beso.style.left = origenX + 'px';
      beso.style.top = origenY + 'px';

      const angulo = Math.random() * Math.PI * 2;
      const distancia = 150 + Math.random() * 300;
      const dx = Math.cos(angulo) * distancia;
      const dy = Math.sin(angulo) * distancia;

      const rotacion = (Math.random() - 0.5) * 720;
      const escala = 0.6 + Math.random() * 0.8;
      const duracion = 2000 + Math.random() * 1500;
      const retraso = Math.random() * 300;

      document.body.appendChild(beso);

      beso.animate([
        { transform: `translate(-50%, -50%) scale(0.3) rotate(0deg)`, opacity: 1 },
        {
          transform: `translate(calc(-50% + ${dx * 0.6}px), calc(-50% + ${dy * 0.6}px)) scale(${escala}) rotate(${rotacion * 0.5}deg)`,
          opacity: 1,
          offset: 0.6
        },
        {
          transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${escala * 0.5}) rotate(${rotacion}deg)`,
          opacity: 0
        }
      ], {
        duration: duracion,
        delay: retraso,
        easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
        fill: 'forwards'
      });

      setTimeout(() => beso.remove(), duracion + retraso + 100);
    }
  }

  /* ===== BOTÓN RECLAMAR (con multiplicador) ===== */
  document.getElementById('btnReclamar').addEventListener('click', function() {
    lanzarBesos(this);

    // Incrementar con el multiplicador activo
    contadorRef.transaction((valorActual) => {
      return (valorActual || 0) + multiplicadorActivo;
    });

    // Resetear multiplicador a 1 después del clic
    multiplicadorActivo = 1;
    document.querySelectorAll('.btn-multiplicador').forEach(b => b.classList.remove('seleccionado'));

    this.style.transform = 'scale(0.95)';
    setTimeout(() => { this.style.transform = ''; }, 150);
  });

  /* ===== RESET SECRETO (doble clic en contador) ===== */
  contadorNumero.addEventListener('dblclick', () => {
    if (confirm('¿Resetear el contador a 0?')) {
      contadorRef.set(0);
    }
  });
</script>
</body>
</html>
